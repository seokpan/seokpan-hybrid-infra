---
# 작성자: 이유빈
# 작성일: 2026-10-07
# 작성내용: AL2023 VPN 서버의 WireGuard 도구 설치 초안 (#16)

# 현재는 문법 검사만 수행합니다.
# 실제 설치값은 선택한 AMI와 공식 저장소에서 확인 후 공급합니다.
# 공식 자료의 후보: wireguard-tools-1.0.20210914-4.amzn2023.x86_64
# 터널·개인키·경로·방화벽·자동 시작은 이 파일에서 설정하지 않습니다.

- name: AWS VPN 서버의 WireGuard 도구 설치
  hosts: vpn_aws
  gather_facts: false
  become: true

  vars:
    vpn_allow_package_install: false
    vpn_wireguard_package: ""
    vpn_wireguard_repository: ""

  pre_tasks:
    - name: 실제 설치 승인과 입력 확인
      ansible.builtin.assert:
        that:
          - vpn_allow_package_install | bool
          - (ansible_host | default('')) is match('^i-([0-9a-f]{8}|[0-9a-f]{17})$')
          - (ansible_aws_ssm_bucket_name | default('') | length) > 0
          - vpn_wireguard_package is match('^wireguard-tools-[0-9][0-9.]*-[0-9][0-9A-Za-z.]*\.amzn2023(\.[0-9]+)*\.x86_64$')
          - vpn_wireguard_repository is match('^[A-Za-z0-9_.:-]+$')
        fail_msg: >-
          실제 설치 승인, 승인된 EC2와 전달 버킷,
          확인한 AL2023 패키지 버전과 공식 저장소 이름을 공급해야 합니다.
      delegate_to: localhost
      become: false

    - name: 대상 서버의 운영체제와 아키텍처 확인
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - distribution
          - architecture

    - name: AL2023 x86_64 서버인지 검사
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Amazon'
          - ansible_facts.distribution_major_version == '2023'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: 승인한 AL2023 x86_64 구성과 다릅니다.

  tasks:
    - name: 확인한 공식 저장소에서 지정한 WireGuard 패키지 설치
      ansible.builtin.dnf:
        name: "{{ vpn_wireguard_package }}"
        state: present
        disablerepo:
          - "*"
        enablerepo:
          - "{{ vpn_wireguard_repository }}"
        disable_gpg_check: false
        allow_downgrade: false

    - name: 실제 설치된 패키지 버전 확인
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - --qf
          - "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}"
          - wireguard-tools
      register: vpn_wireguard_installed
      changed_when: false

    - name: 설치값이 지정한 패키지와 일치하는지 검사
      ansible.builtin.assert:
        that:
          - vpn_wireguard_installed.stdout == vpn_wireguard_package
        fail_msg: >-
          설치된 패키지가 지정한 버전과 다릅니다.
          자동으로 다른 버전으로 변경하지 않고 확인해야 합니다.

    - name: WireGuard 도구 실행 확인
      ansible.builtin.command:
        argv:
          - wg
          - --version
      register: vpn_wireguard_tool_version
      changed_when: false

    - name: 설치 확인 결과 안내
      ansible.builtin.debug:
        msg:
          - "설치 패키지: {{ vpn_wireguard_installed.stdout }}"
          - "도구 실행 결과: {{ vpn_wireguard_tool_version.stdout }}"
          - "터널 통신·커널 지원·재부팅 복구 검증은 별도 작업입니다."
