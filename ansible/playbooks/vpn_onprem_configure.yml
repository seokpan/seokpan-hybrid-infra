# 작성자: 이유빈
# 작성 내용: 기존 상태 보존과 실패 시 원복을 보완한 VPN 설정 작업
---
- name: 온프레미스 VPN 설정과 자동 시작 준비
  hosts: vpn_onprem
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    vpn_allow_onprem_configuration: false
    vpn_allow_onprem_service_start: false
    vpn_new_files:
    - /etc/firewalld/zones/seokpan-vpn.xml
    - /etc/firewalld/policies/seokpan_to_vpn.xml
    - /etc/firewalld/policies/seokpan_from_vpn.xml
    - /etc/sysctl.d/90-seokpan-vpn.conf
    - /etc/wireguard/wg0.conf
    vpn_directory_paths:
    - path: /etc/firewalld/zones
      mode: '0755'
    - path: /etc/firewalld/policies
      mode: '0755'
    - path: /etc/sysctl.d
      mode: '0755'
    - path: /etc/wireguard
      mode: '0700'
  pre_tasks:
  - name: 실제 적용 선택과 단일 VPN 서버 확인
    ansible.builtin.assert:
      that:
      - vpn_allow_onprem_configuration | bool
      - not ansible_check_mode
      - ansible_play_hosts_all | length == 1
      - (ansible_host | default(inventory_hostname)) == '10.1.93.98'
      - vpn_public_input_file is defined
      - vpn_foundation_input_file is defined
      fail_msg: 기존 키 공급과 실제 입력 검토 후 명시적인 적용 선택이 필요합니다.
    delegate_to: localhost
    become: false
  - name: Controller의 보호 후보 폴더 준비
    ansible.builtin.tempfile:
      state: directory
      prefix: seokpan-vpn-candidate-
      path: '{{ lookup(''env'', ''HOME'') }}/.local/share/seokpan-hybrid/vpn-execution'
    register: vpn_candidate
    delegate_to: localhost
    become: false
  - name: 기존 검사 프로그램으로 실제 공개 입력 검증과 설정 생성
    ansible.builtin.command:
      argv:
      - '{{ ansible_playbook_python }}'
      - '{{ playbook_dir }}/../../scripts/prepare-vpn-public-configs.py'
      - --input
      - '{{ vpn_public_input_file }}'
      - --foundation-input
      - '{{ vpn_foundation_input_file }}'
      - --output-dir
      - '{{ vpn_candidate.path }}/generated'
    delegate_to: localhost
    become: false
    no_log: true
  - name: 검증한 공개 입력 읽기
    ansible.builtin.include_vars:
      file: '{{ vpn_public_input_file }}'
      name: vpn_settings
    no_log: true
  - name: 실제 서버 이름 확인
    ansible.builtin.command:
      argv:
      - hostname
      - -s
    register: vpn_hostname
    changed_when: false
  - name: 예상한 서버인지 확인
    ansible.builtin.assert:
      that:
      - vpn_hostname.stdout == 'vpn-gw-01'
      fail_msg: 예상한 온프레미스 VPN 서버가 아닙니다.
  - name: 방화벽 실행과 정책 기능 확인
    ansible.builtin.command:
      argv: '{{ item }}'
    loop:
    - - firewall-cmd
      - --state
    - - firewall-cmd
      - --get-policies
    - - firewall-cmd
      - --check-config
    changed_when: false
    no_log: true
  - name: 기존 실행 중 방화벽 설정 조회
    ansible.builtin.command:
      argv: '{{ item }}'
    loop:
    - - firewall-cmd
      - --list-all-zones
    - - firewall-cmd
      - --list-all-policies
    - - firewall-cmd
      - --direct
      - --get-all-rules
    - - firewall-cmd
      - --direct
      - --get-all-passthroughs
    register: vpn_runtime
    changed_when: false
    no_log: true
  - name: 기존 영구 방화벽 설정 조회
    ansible.builtin.command:
      argv: '{{ item }}'
    loop:
    - - firewall-cmd
      - --permanent
      - --list-all-zones
    - - firewall-cmd
      - --permanent
      - --list-all-policies
    - - firewall-cmd
      - --permanent
      - --direct
      - --get-all-rules
    - - firewall-cmd
      - --permanent
      - --direct
      - --get-all-passthroughs
    register: vpn_permanent
    changed_when: false
    no_log: true
  - name: 방화벽 다시 읽기 전 기존 설정 보존 조건 확인
    ansible.builtin.assert:
      that:
      - (vpn_runtime.results[0].stdout | regex_replace(' \(active\)', '')) == (vpn_permanent.results[0].stdout | regex_replace('
        \(active\)', ''))
      - (vpn_runtime.results[1].stdout | regex_replace(' \(active\)', '')) == (vpn_permanent.results[1].stdout | regex_replace('
        \(active\)', ''))
      - vpn_runtime.results[2].stdout == vpn_permanent.results[2].stdout
      - vpn_runtime.results[3].stdout == vpn_permanent.results[3].stdout
      fail_msg: 실행 중 설정과 영구 설정이 다릅니다. 자동 적용하지 않고 기존 규칙 보존 방법을 먼저 검토합니다.
    no_log: true
  - name: 기존 통신 전달 값 확인
    ansible.builtin.command:
      argv:
      - sysctl
      - -n
      - net.ipv4.ip_forward
    register: vpn_original_forward
    changed_when: false
  - name: 기존 VPN 실행 여부 확인
    ansible.builtin.command:
      argv:
      - systemctl
      - is-active
      - wg-quick@wg0
    register: vpn_original_service
    changed_when: false
    failed_when: vpn_original_service.rc not in [0, 3, 4]
  - name: 기존 VPN 자동 시작 설정 확인
    ansible.builtin.command:
      argv:
      - systemctl
      - is-enabled
      - wg-quick@wg0
    register: vpn_original_enabled
    changed_when: false
    failed_when: vpn_original_enabled.rc not in [0, 1, 4]
  - name: 기존 실행 중 VPN을 변경하지 않도록 확인
    ansible.builtin.assert:
      that:
      - vpn_original_forward.stdout in ['0', '1']
      - vpn_original_service.stdout != 'active'
      - vpn_original_enabled.stdout in ['enabled', 'disabled']
      fail_msg: 기존 VPN 실행 상태 또는 전달 값을 별도 확인해야 합니다.
  - name: 기존 개인키 파일의 보호 상태 확인
    ansible.builtin.stat:
      path: /etc/wireguard/keys/wg0.key
      follow: false
      get_checksum: false
      get_mime: false
    register: vpn_keyfile
    no_log: true
  - name: 기존 키 공급이 완료됐는지 확인
    ansible.builtin.assert:
      that:
      - vpn_keyfile.stat.exists
      - vpn_keyfile.stat.isreg | default(false)
      - not (vpn_keyfile.stat.islnk | default(false))
      - vpn_keyfile.stat.uid == 0
      - vpn_keyfile.stat.mode == '0600'
      fail_msg: 기존 VPN 키를 별도 보호 경로로 공급해야 합니다. 새 키를 생성하지 않습니다.
    no_log: true
  - name: 공급한 개인키의 공개키 확인
    ansible.builtin.command:
      argv:
      - /bin/bash
      - -c
      - /usr/bin/wg pubkey < /etc/wireguard/keys/wg0.key
    register: vpn_key_public
    changed_when: false
    no_log: true
  - name: 기존 키와 공개 설정의 대응 확인
    ansible.builtin.assert:
      that:
      - vpn_key_public.stdout | trim == vpn_settings.vpn_wireguard_onprem_public_key
      fail_msg: 공급한 키와 공개 설정의 공개키가 다릅니다.
    no_log: true
  - name: 이번에 작성할 서버 파일 존재 여부 확인
    ansible.builtin.stat:
      path: '{{ item }}'
      follow: false
      get_checksum: false
      get_mime: false
    loop: '{{ vpn_new_files }}'
    register: vpn_existing_files
  - name: 기존 파일을 덮어쓰지 않도록 확인
    ansible.builtin.assert:
      that:
      - not item.stat.exists
      fail_msg: 동일한 설정 파일이 이미 있습니다. 자동으로 덮어쓰지 않습니다.
    loop: '{{ vpn_existing_files.results }}'
    no_log: true
  - name: 설정 폴더의 기존 상태 확인
    ansible.builtin.stat:
      path: '{{ item.path }}'
      follow: false
      get_checksum: false
      get_mime: false
    loop: '{{ vpn_directory_paths }}'
    register: vpn_existing_directories
  - name: 기존 폴더의 소유자와 형식 확인
    ansible.builtin.assert:
      that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.uid == 0
      fail_msg: 설정 폴더의 소유자 또는 형식이 예상과 다릅니다.
    loop: '{{ vpn_existing_directories.results }}'
    no_log: true
  - name: 서버의 보호 실행 기록 폴더 준비
    ansible.builtin.tempfile:
      state: directory
      prefix: seokpan-vpn-change-
      path: /root
    register: vpn_server_record
  - name: 원복을 위한 기존 상태 기록
    ansible.builtin.copy:
      dest: '{{ vpn_server_record.path }}/before.json'
      owner: root
      group: root
      mode: '0600'
      content: "{{\n  {\n    'enabled': vpn_original_enabled.stdout, 'forward': vpn_original_forward.stdout,\n    'runtime':\
        \ vpn_runtime.results | map(attribute='stdout') | list,\n    'permanent': vpn_permanent.results | map(attribute='stdout')\
        \ | list,\n    'new_files': vpn_new_files\n  } | to_nice_json\n}}"
    no_log: true
  tasks:
  - name: 새 설정 공급과 실행
    block:
    - name: 없는 설정 폴더만 생성하고 기존 폴더 권한 유지
      ansible.builtin.file:
        path: '{{ item.item.path }}'
        state: directory
        owner: root
        group: root
        mode: '{{ item.item.mode }}'
      loop: '{{ vpn_existing_directories.results }}'
      when: not item.stat.exists
    - name: VPN 전용 구역과 전달 정책 공급
      ansible.builtin.template:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        owner: root
        group: root
        mode: '0600'
        force: false
      loop:
      - src: ../templates/vpn_onprem_zone.xml.j2
        dest: /etc/firewalld/zones/seokpan-vpn.xml
      - src: ../templates/vpn_onprem_to_tunnel.xml.j2
        dest: /etc/firewalld/policies/seokpan_to_vpn.xml
      - src: ../templates/vpn_onprem_from_tunnel.xml.j2
        dest: /etc/firewalld/policies/seokpan_from_vpn.xml
      vars:
        vpn_wireguard_interface: '{{ vpn_settings.vpn_wireguard_interface }}'
        vpn_wireguard_onprem_job_host_cidrs: '{{ vpn_settings.vpn_wireguard_onprem_job_host_cidrs }}'
        vpn_wireguard_aws_destination_cidrs: '{{ vpn_settings.vpn_wireguard_aws_destination_cidrs }}'
        vpn_wireguard_allowed_tcp_ports: '{{ vpn_settings.vpn_wireguard_allowed_tcp_ports }}'
      no_log: true
    - name: 서버의 실제 방화벽 해석기로 새 설정 검사
      ansible.builtin.command:
        argv:
        - firewall-cmd
        - --check-config
      changed_when: false
      no_log: true
    - name: 기존 상태 추적을 유지하며 방화벽 다시 읽기
      ansible.builtin.command:
        argv:
        - firewall-cmd
        - --reload
      no_log: true
    - name: 통신 전달 영구 설정 공급
      ansible.builtin.template:
        src: ../templates/vpn_ip_forward.conf.j2
        dest: /etc/sysctl.d/90-seokpan-vpn.conf
        owner: root
        group: root
        mode: '0600'
        force: false
    - name: 검증한 온프레미스 공개 설정 공급
      ansible.builtin.copy:
        src: '{{ vpn_candidate.path }}/generated/onprem-wg0.conf'
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
        force: false
      no_log: true
    - name: IPv4 통신 전달 활성화
      ansible.builtin.command:
        argv:
        - sysctl
        - -w
        - net.ipv4.ip_forward=1
    - name: 별도 실행 선택 후 VPN 시작과 자동 시작 설정
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      when: vpn_allow_onprem_service_start | bool
    - name: 실행 범위 안내
      ansible.builtin.debug:
        msg: 설정 공급을 완료했습니다. 서비스 시작 여부는 별도 실행 선택에 따릅니다. 실제 AWS 연결·DB 접속 검증은 후속 작업입니다.
    rescue:
    - name: VPN 중지와 원래 자동 시작 상태 복원
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: '{{ vpn_original_enabled.stdout == ''enabled'' }}'
        state: stopped
      when: vpn_allow_onprem_service_start | bool
      ignore_errors: true
    - name: 이번에 새로 공급한 설정 파일만 제거
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop: '{{ vpn_new_files }}'
      ignore_errors: true
    - name: 기존 방화벽 설정 다시 읽기
      ansible.builtin.command:
        argv:
        - firewall-cmd
        - --reload
      no_log: true
      ignore_errors: true
    - name: 기존 통신 전달 값 복원
      ansible.builtin.command:
        argv:
        - sysctl
        - -w
        - net.ipv4.ip_forward={{ vpn_original_forward.stdout }}
      ignore_errors: true
    - name: 실패 결과를 확인하도록 중단
      ansible.builtin.fail:
        msg: 설정 적용에 실패해 원복을 시도했습니다. 원복 단계의 성공 여부까지 실행 로그에서 확인해야 합니다. 자동으로 반복 실행하지 마세요.
