name: Final B body wording
on:
  push:
    branches: [fix/b-fixture-execution-identity-20261007]
    paths: [.github/workflows/body-cleanup-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  correct:
    if: ${{ github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: '${{ github.sha }}'}
      - name: Correct reviewed B body and verify exact readback
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/maintenance
          cat > .github/maintenance/reviewed-input.json <<'JSON'
          {"schema_version":1,"repository":"seokpan/seokpan-hybrid-infra","files":{},"metadata":[{"endpoint":"issues/25","before_sha256":"72bee70b92abdc2ff56e5d12518c140c12e3e277910ad81f0be6409bccfbedd8","after_sha256":"74dbe34bc4fadb1bff9010b623dbcaf30dc6e03ffed65e174dad975cbb2c7f5f","edits":[[214,215,"21:28 KST에 정한 **후속 수행 범위는 유료 AWS/ROSA 자원을 사용하지 않는 Source·문서·인계 정리**입니다. 승인된 아키텍처와 비용/실행 Gate를 유지하지만, 이 계속 진행 요청을 실제 유료 자원 생성·시작·가동 시간 연장에 대한 승인으로 해석하지 않습니다. 실제 실행이 필요해지면 사용할 자원·기간·예상 비용·삭제/잔존 책임과 실행 준비를 먼저 구체화하고 해당 실행의 명시적 동의를 확인합니다. 지금 Cloud 로그인·Credential 수신·Backend/Plan/Apply/Destroy·ROSA 생성·유료 자원 조작은 진행하지 않습니다.\n"]]}]}
          JSON
          curl -fsSL --retry 2 https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/a98b14a509078c34581b93dae7d8fb12f02d1684/.github/maintenance/apply-reviewed-resume.py -o "$RUNNER_TEMP/helper.py"
          test "$(git hash-object "$RUNNER_TEMP/helper.py")" = e06ac3181d83131c2cc986c0ad58bb3e8ae39d0d
          python3 "$RUNNER_TEMP/helper.py"
          rm .github/maintenance/reviewed-input.json
          git diff --exit-code
          git rm .github/workflows/body-cleanup-temporary.yml
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: finish objective B body wording and remove temporary workflow'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/reviewed-resume-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: body-wording-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-resume-report
          retention-days: 14
