name: Managed GitHub authentication boundaries
on:
  pull_request:
    paths:
      - 'tools/cloud-prestart/repair_managed_github_idp.py'
      - 'tools/cloud-prestart/test_managed_github_idp.py'
      - '.github/workflows/managed-github-auth-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-provider-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -I tools/cloud-prestart/test_managed_github_idp.py -v
