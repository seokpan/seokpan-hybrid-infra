name: Fixture review scope verification
on:
  push:
    branches: [fix/b-fixture-review-scope-20261007]
    paths: [.github/workflows/fixture-review-temporary.yml]
permissions:
  contents: write
jobs:
  verify:
    if: ${{ github.actor == 'tjung03' && github.repository == 'seokpan/seokpan-hybrid-infra' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact metadata corrections and remove only temporary inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c10bcab3cf4e264b7b7b8333000b94912dcf6fe5
          mkdir "$RUNNER_TEMP/fixture-review"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          changes=json.loads(Path('.github/maintenance/fixture-review.json').read_text());hashes={}
          allowed={'tools/recovery_business_fixture/run.py','tools/recovery_business_fixture/README.md','tools/test_fixture_evidence_identity.py'}
          for change in changes:
              assert change['path'] in allowed
              p=Path(change['path']);text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==change['pre_sha256'],str(p)
              assert text.count(change['old'])==1,str(p)
              new=text.replace(change['old'],change['new']);assert hashlib.sha256(new.encode()).hexdigest()==change['post_sha256']
              p.write_text(new);hashes[str(p)]=change['post_sha256']
          assert set(hashes)==allowed
          (Path(os.environ['RUNNER_TEMP'])/'fixture-review/output-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
          git add tools/recovery_business_fixture/run.py tools/recovery_business_fixture/README.md tools/test_fixture_evidence_identity.py
          git rm .github/maintenance/fixture-review.json .github/workflows/fixture-review-temporary.yml
          test "$(git diff --cached --name-only ceb6fad7b8976941ad93b2b67dbecafd1e0c0959 | wc -l)" -eq 3
          git diff --cached --exit-code ceb6fad7b8976941ad93b2b67dbecafd1e0c0959 -- terraform evidence .github
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'docs: distinguish recovery functional scope and operational fixture limitations'
      - name: Run all metadata tests on the final clean commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_fixture_evidence_identity.py -v > "$RUNNER_TEMP/fixture-review/tests.log" 2>&1
          grep -F 'Ran 10 tests' "$RUNNER_TEMP/fixture-review/tests.log"
          grep -Fx OK "$RUNNER_TEMP/fixture-review/tests.log"
          git diff --exit-code
          python3 --version > "$RUNNER_TEMP/fixture-review/python-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/fixture-review/source-sha.txt"
          git diff ceb6fad7b8976941ad93b2b67dbecafd1e0c0959 HEAD > "$RUNNER_TEMP/fixture-review/changes.patch"
          git bundle create "$RUNNER_TEMP/fixture-review/source.bundle" HEAD
          test "$(git ls-remote origin refs/heads/fix/b-fixture-review-scope-20261007 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/b-fixture-review-scope-20261007
          printf '%s\n' 'Metadata emitter unit tests only; no DB, Redis, Valkey, Cloud, backup or historic Evidence run.' > "$RUNNER_TEMP/fixture-review/SCOPE.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixture-review-${{ github.run_id }}
          path: ${{ runner.temp }}/fixture-review/
          if-no-files-found: error
          retention-days: 30
