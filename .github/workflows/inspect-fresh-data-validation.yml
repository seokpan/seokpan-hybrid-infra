name: Fresh Data setup read-only inspection
on:
  pull_request:
    paths:
      - 'tools/cloud-prestart/inspect_fresh_data.py'
      - 'tools/cloud-prestart/test_inspect_fresh_data.py'
      - '.github/workflows/inspect-fresh-data-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-setup-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -I tools/cloud-prestart/test_inspect_fresh_data.py -v
