name: ROSA preservation and lifecycle source boundaries
on:
  pull_request:
    paths:
      - scripts/prepare-rosa-checkpoint.py
      - scripts/rosa-lifecycle-plan.py
      - scripts/test_rosa_preservation.py
      - scripts/rosa-preservation-batch.sh
      - scripts/rosa-delete.sh
      - scripts/rosa-create.sh
      - scripts/rosa-lifecycle-entry.sh
      - scripts/rosa-lifecycle-entry.py
      - scripts/collect-rosa-restoration-gaps.py
      - scripts/rosa-monitoring-volume-backup.py
      - scripts/verify-rosa-independent-supplements.py
      - scripts/rosa-monitoring-preservation.sh
      - docs/ROSA_CHECKPOINT_LIFECYCLE.md
      - .github/workflows/rosa-preservation-validation.yml
      - scripts/prepare-rosa-reconstruction.py
      - scripts/rosa-fresh-management.py
      - scripts/rosa-gitops-bootstrap.py
      - scripts/rosa-held-restoration.py
      - scripts/rosa-held-restoration.sh
      - scripts/rosa-restore.sh
      - scripts/test_rosa_reconstruction.py
      - terraform/bootstrap/rosa_monitoring_preservation.tf
  push:
    branches: [main]
    paths:
      - scripts/prepare-rosa-checkpoint.py
      - scripts/rosa-lifecycle-plan.py
      - scripts/test_rosa_preservation.py
      - scripts/rosa-preservation-batch.sh
      - scripts/rosa-delete.sh
      - scripts/rosa-create.sh
      - scripts/rosa-lifecycle-entry.sh
      - scripts/rosa-lifecycle-entry.py
      - scripts/collect-rosa-restoration-gaps.py
      - scripts/rosa-monitoring-volume-backup.py
      - scripts/verify-rosa-independent-supplements.py
      - scripts/rosa-monitoring-preservation.sh
      - .github/workflows/rosa-preservation-validation.yml
      - scripts/prepare-rosa-reconstruction.py
      - scripts/rosa-fresh-management.py
      - scripts/rosa-gitops-bootstrap.py
      - scripts/rosa-held-restoration.py
      - scripts/rosa-held-restoration.sh
      - scripts/rosa-restore.sh
      - scripts/test_rosa_reconstruction.py
      - terraform/bootstrap/rosa_monitoring_preservation.tf
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s scripts -p 'test_rosa_*.py' -v
      - run: bash -n scripts/rosa-preservation-batch.sh
      - run: for path in scripts/rosa-delete.sh scripts/rosa-create.sh scripts/rosa-lifecycle-entry.sh scripts/rosa-monitoring-preservation.sh scripts/rosa-held-restoration.sh scripts/rosa-restore.sh; do bash -n "$path"; done
      - name: Validate only the added snapshot permission HCL syntax
        run: |
          curl --fail --silent --show-error --location https://releases.hashicorp.com/terraform/1.16.4/terraform_1.16.4_linux_amd64.zip -o /tmp/rosa-terraform.zip
          echo 'dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df  /tmp/rosa-terraform.zip' | sha256sum --check
          unzip -q /tmp/rosa-terraform.zip -d /tmp/rosa-terraform
          /tmp/rosa-terraform/terraform fmt -check terraform/bootstrap/rosa_monitoring_preservation.tf
