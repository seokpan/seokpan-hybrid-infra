name: Fixture summary scope follow-up
on:
  push:
    branches: [fix/b-fixture-execution-identity-20261007]
    paths: [.github/workflows/fixture-scope-followup-temporary.yml]
permissions:
  contents: write
concurrency:
  group: b-fixture-scope-followup
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-infra' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_HEAD: 1d7076785bb4c91613308409e5215e50d06c3ebf
      BRANCH: fix/b-fixture-execution-identity-20261007
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply two identity-checked source edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/scope-report"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          edits={
            'tools/recovery_business_fixture/run.py': (
              '32bb2b4cfede4436db066fc1eaac16b8f4ed702fc3d551312fd0169708b480e1',
              'f31844855967de5ab38156f10a1272a9b98cb94e24d5b7187da8cc182226a595',
              'The minimum design clarification distinguishes preserved historical records/relations checked by operator SQL, restored member ranking/rating visible to a fresh client, and new-game completion/result visible in the new Runtime. B and the design review must explicitly confirm this scope.',
              'The adopted recovery scope (Docs PR #30; design/03_DETAILED_DESIGN.md, section 3-I.14.5) distinguishes historical records/relations verified by operator SQL, restored member ranking/rating visible to a fresh client, and new-game completion/result visible in the new Runtime. Historical individual-result HTTP is outside the adopted recovery Must; this known limitation does not reopen design approval or establish full T18 acceptance.'),
            'tools/test_fixture_evidence_identity.py': (
              '44166925582c065351d70f19c0311adc2e0b5355bcc2dbc9b6de03420f59de9e',
              '780d018bbc736eed5c372547e2a4fe8215b7bcc19c418caa77405b998dda6667',
              '    def test_invalid_operator_creates_no_output(self):',
              '''    def test_business_summary_uses_adopted_scope_without_reopening_approval(self):
                  with tempfile.TemporaryDirectory() as directory:
                      args=self.args(Path(directory)/'result');self.emit(BUSINESS,args)
                      summary=(args.output/'summary.md').read_text()
                      self.assertIn('outside the adopted recovery Must',summary)
                      self.assertNotIn('B and the design review must explicitly confirm',summary)
                      self.assertIn('full T18 Acceptance: NOT RUN',summary)
                      self.assertEqual(json.loads((args.output/'release.json').read_text())['recovery']['rto_seconds'],None)

              def test_invalid_operator_creates_no_output(self):''')}
          # YAML indentation is stripped uniformly; construct the Python test block explicitly.
          test='    def test_business_summary_uses_adopted_scope_without_reopening_approval(self):\n        with tempfile.TemporaryDirectory() as directory:\n            args=self.args(Path(directory)/\'result\');self.emit(BUSINESS,args)\n            summary=(args.output/\'summary.md\').read_text()\n            self.assertIn(\'outside the adopted recovery Must\',summary)\n            self.assertNotIn(\'B and the design review must explicitly confirm\',summary)\n            self.assertIn(\'full T18 Acceptance: NOT RUN\',summary)\n            self.assertEqual(json.loads((args.output/\'release.json\').read_text())[\'recovery\'][\'rto_seconds\'],None)\n\n    def test_invalid_operator_creates_no_output(self):'
          item=edits['tools/test_fixture_evidence_identity.py']
          edits['tools/test_fixture_evidence_identity.py']=(*item[:3],test)
          prepared={};hashes={}
          for name,(before,after,old,new) in edits.items():
              path=Path(name);raw=path.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=before:raise RuntimeError('Source moved: '+name)
              text=raw.decode();assert text.count(old)==1,name
              output=text.replace(old,new).encode();assert hashlib.sha256(output).hexdigest()==after,name
              prepared[path]=output;hashes[name]=after
          for path,output in prepared.items():path.write_bytes(output)
          (Path(os.environ['RUNNER_TEMP'])/'scope-report/hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - name: Evidence-only regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p test_fixture_evidence_identity.py -v 2>&1 | tee "$RUNNER_TEMP/scope-report/tests.log"
      - name: Publish checked feature-branch change
        shell: bash
        run: |
          set -euo pipefail
          git add tools/recovery_business_fixture/run.py tools/test_fixture_evidence_identity.py
          git rm .github/workflows/fixture-scope-followup-temporary.yml
          git diff --cached --check
          python3 - <<'PY'
          import os,subprocess,shutil
          from pathlib import Path
          expected={'tools/recovery_business_fixture/run.py','tools/test_fixture_evidence_identity.py'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only',os.environ['EXPECTED_HEAD']],text=True).splitlines())
          assert actual==expected,actual
          report=Path(os.environ['RUNNER_TEMP'])/'scope-report'
          (report/'changes.patch').write_bytes(subprocess.check_output(['git','diff','--cached',os.environ['EXPECTED_HEAD']]))
          for name in expected:
              target=report/'files'/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,target)
          PY
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'fix: keep adopted recovery scope consistent in new fixture evidence'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/scope-report/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: fixture-scope-followup-${{ github.run_id }}
          path: ${{ runner.temp }}/scope-report
          if-no-files-found: error
          retention-days: 14
