name: Cutover readiness reader validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/collect-cutover-readiness.py'
      - 'scripts/test-cutover-readiness.py'
      - '.github/workflows/cutover-readiness-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-cutover-readiness.py'
      - 'scripts/test-cutover-readiness.py'
      - '.github/workflows/cutover-readiness-validation.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test read-only target selection without credentials
        run: python3 scripts/test-cutover-readiness.py
      - name: Confirm source remained unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
