name: Fixture execution identity verification
on:
  push:
    branches: [fix/b-fixture-execution-identity-20261007]
    paths: [.github/workflows/fixture-identity-maintenance-temporary.yml]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: fixture-identity-maintenance
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.repository == 'seokpan/seokpan-hybrid-infra' && github.actor == 'tjung03' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/b-fixture-execution-identity-20261007
      BASE_SHA: 2af2d61f6985ca15dbe8415c84712575f0e92aeb
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply source-only correction from the fixed reviewed maintenance script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity-report"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/seokpan/seokpan-hybrid-docs/203eddc69b30f46eca8e9d23cb94532a38f6165c/.github/maintenance/current_review.py' -o "$RUNNER_TEMP/identity-report/maintenance.py"
          git diff --exit-code "$BASE_SHA" -- tools/recovery_fixture tools/recovery_business_fixture
          python3 "$RUNNER_TEMP/identity-report/maintenance.py" source-infra
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/recovery_fixture/run.py');s=p.read_text()
          if '\nimport re\n' not in s:s=s.replace('\nimport pwd\n','\nimport pwd\nimport re\n',1)
          p.write_text(s)
          PY
      - name: Execute evidence-only regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p test_fixture_evidence_identity.py -v 2>&1 | tee "$RUNNER_TEMP/identity-report/unit-tests.log"
          python3 - <<'PY'
          import ast,hashlib,json,os,subprocess
          from pathlib import Path
          allowed={'tools/recovery_fixture/run.py','tools/recovery_fixture/README.md','tools/recovery_business_fixture/run.py','tools/recovery_business_fixture/README.md','tools/test_fixture_evidence_identity.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']],text=True).splitlines())
          changed.discard('.github/workflows/fixture-identity-maintenance-temporary.yml')
          assert changed==allowed,(changed,allowed)
          for name in allowed:
              p=Path(name)
              if p.suffix=='.py':ast.parse(p.read_text(),filename=name)
          subprocess.run(['git','diff','--exit-code',os.environ['BASE_SHA'],'--','terraform','handoff','.github/workflows/terraform-static-validation.yml'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'identity-report'
          for name in allowed:
              p=out/'files'/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(Path(name).read_bytes())
          (out/'source-hashes.json').write_text(json.dumps({name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(allowed)},indent=2)+'\n')
          (out/'reviewed.patch').write_bytes(subprocess.check_output(['git','diff',os.environ['BASE_SHA'],'--',*sorted(allowed)]))
          PY
      - name: Publish only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add tools/recovery_fixture/run.py tools/recovery_fixture/README.md tools/recovery_business_fixture/run.py tools/recovery_business_fixture/README.md tools/test_fixture_evidence_identity.py
          git rm .github/workflows/fixture-identity-maintenance-temporary.yml
          git -c core.whitespace=-blank-at-eol,blank-at-eof,space-before-tab diff --cached --check
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --author='tjung03 <73955817+tjung03@users.noreply.github.com>' -m 'fix: record explicit fixture executor without inferring review or custody'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/identity-report/published-commit.txt"
      - name: Normalize only B-owned collaboration records
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/identity-report/maintenance.py" metadata --repository "$GITHUB_REPOSITORY" --report "$RUNNER_TEMP/identity-report/metadata"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: fixture-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/identity-report
          retention-days: 14
          if-no-files-found: error
